<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credentials</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #111827;
      --bg-3: #1e293b;
      --surface: rgba(17, 24, 39, 0.78);
      --surface-2: rgba(15, 23, 42, 0.9);
      --line: rgba(148, 163, 184, 0.24);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-2: #16a34a;
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.12);
      --shadow: 0 20px 60px rgba(2, 6, 23, 0.55);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 10%, #1d4ed833 0%, transparent 38%),
        radial-gradient(circle at 80% 20%, #16a34a22 0%, transparent 40%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2) 45%, var(--bg-3));
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    main {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0;
    }

    .shell {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(160deg, var(--surface), var(--surface-2));
      box-shadow: var(--shadow);
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      padding: 28px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0 0 8px;
      color: #f8fafc;
      font-size: 34px;
      line-height: 1.12;
    }

    h2 {
      margin: 0;
      color: #f8fafc;
      font-size: 18px;
    }

    .subtitle,
    .message,
    .path {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .content {
      display: grid;
      gap: 18px;
      padding: 26px 28px 28px;
    }

    .panel,
    .credential-item {
      display: grid;
      gap: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      background: rgba(148, 163, 184, 0.04);
    }

    .credential-item {
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .title {
      margin: 0 0 6px;
      color: #f8fafc;
      font-weight: 800;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    label {
      display: grid;
      gap: 8px;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      color: #e2e8f0;
      font: inherit;
      outline: none;
      background: rgba(15, 23, 42, 0.55);
    }

    input:focus {
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
    }

    button,
    .button-link {
      min-height: 42px;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .primary {
      border: 1px solid #22c55e99;
      background: linear-gradient(120deg, var(--accent-2), var(--accent));
      color: #f0fdf4;
    }

    .secondary,
    .button-link {
      border: 1px solid var(--line);
      background: rgba(148, 163, 184, 0.08);
      color: #e5e7eb;
    }

    .danger-button {
      border: 1px solid #f87171aa;
      background: var(--danger-soft);
      color: #fecaca;
    }

    .hidden {
      display: none !important;
    }

    .message.error {
      color: #fecaca;
      font-weight: 700;
    }

    @media (max-width: 760px) {
      main {
        width: min(100% - 18px, 980px);
        padding: 14px 0;
      }

      header,
      .credential-item {
        grid-template-columns: 1fr;
        display: grid;
      }

      header,
      .content {
        padding-left: 16px;
        padding-right: 16px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="shell" aria-labelledby="page-title">
      <header>
        <div>
          <h1 id="page-title">Manage Credentials</h1>
          <p class="subtitle" id="page-subtitle">Add sender owners for Gmail app-password sending.</p>
        </div>
        <a class="button-link" href="/">Back to Sender</a>
      </header>

      <div id="manager-view" class="content">
        <section class="panel">
          <div class="actions">
            <a class="primary button-link" href="/credentials_ui.html?new=1">Add Credential</a>
          </div>
          <div id="credential-list" class="list"></div>
          <p id="manager-message" class="message">Loading credentials...</p>
        </section>
      </div>

      <div id="editor-view" class="content hidden">
        <section class="panel">
          <h2 id="editor-title">Add Credential</h2>
          <label>
            Owner name
            <input id="owner-name" type="text" placeholder="Abhishek" required />
          </label>
          <label>
            Sender email
            <input id="sender-email" type="email" placeholder="name@gmail.com" required />
          </label>
          <label>
            Google app password
            <input id="app-password" type="password" placeholder="16 character Gmail app password" required />
          </label>
          <p class="subtitle">When editing, leave app password blank to keep the existing saved password.</p>
          <div class="actions">
            <button class="primary" type="button" id="save-credential">Save Credential</button>
            <a class="secondary button-link" href="/credentials_ui.html">Back to List</a>
          </div>
          <p id="editor-message" class="message"></p>
        </section>
      </div>
    </section>
  </main>

  <script>
    const managerView = document.querySelector("#manager-view");
    const editorView = document.querySelector("#editor-view");
    const credentialList = document.querySelector("#credential-list");
    const managerMessage = document.querySelector("#manager-message");
    const editorMessage = document.querySelector("#editor-message");
    const editorTitle = document.querySelector("#editor-title");
    const ownerNameInput = document.querySelector("#owner-name");
    const senderEmailInput = document.querySelector("#sender-email");
    const appPasswordInput = document.querySelector("#app-password");
    const saveCredentialButton = document.querySelector("#save-credential");
    let currentId = "";

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function setMessage(element, text, isError = false) {
      element.textContent = text;
      element.classList.toggle("error", isError);
    }

    async function fetchJson(url, options) {
      const response = await fetch(url, options);
      const text = await response.text();
      const data = text ? JSON.parse(text) : {};

      if (!response.ok || data.ok === false) {
        throw new Error(data.message || `Request failed with status ${response.status}.`);
      }

      return data;
    }

    function showManager() {
      managerView.classList.remove("hidden");
      editorView.classList.add("hidden");
    }

    function showEditor(isNew) {
      managerView.classList.add("hidden");
      editorView.classList.remove("hidden");
      editorTitle.textContent = isNew ? "Add Credential" : "Edit Credential";
    }

    function queryValue(name) {
      return new URLSearchParams(window.location.search).get(name) || "";
    }

    async function loadCredentials() {
      const data = await fetchJson("/api/credentials");
      const credentials = Array.isArray(data.credentials) ? data.credentials : [];
      credentialList.innerHTML = "";

      if (!credentials.length) {
        setMessage(managerMessage, "No credentials found. Add your first owner credential.");
        return;
      }

      credentials.forEach((credential) => {
        const item = document.createElement("article");
        item.className = "credential-item";
        item.innerHTML = `
          <div>
            <p class="title">${escapeHtml(credential.ownerName)}</p>
            <p class="path">${escapeHtml(credential.senderEmail)}</p>
          </div>
          <div class="actions">
            ${credential.editable ? `<a class="secondary button-link" href="/credentials_ui.html?id=${encodeURIComponent(credential.id)}">Edit</a>` : ""}
            ${credential.editable ? `<button class="danger-button" type="button" data-delete="${escapeHtml(credential.id)}">Delete</button>` : ""}
          </div>
        `;

        const deleteButton = item.querySelector("[data-delete]");
        if (deleteButton) {
          deleteButton.addEventListener("click", () => deleteCredential(credential));
        }

        credentialList.appendChild(item);
      });

      setMessage(managerMessage, `${credentials.length} credential owner${credentials.length === 1 ? "" : "s"} found.`);
    }

    async function loadCredential(id) {
      const data = await fetchJson(`/api/credentials?id=${encodeURIComponent(id)}`);
      currentId = data.credential.id;
      ownerNameInput.value = data.credential.ownerName || "";
      senderEmailInput.value = data.credential.senderEmail || "";
      appPasswordInput.value = "";
      appPasswordInput.required = false;
      appPasswordInput.placeholder = "Leave blank to keep existing app password";
    }

    async function saveCredential() {
      try {
        if (!ownerNameInput.value.trim()) {
          setMessage(editorMessage, "Owner name must not be empty.", true);
          ownerNameInput.focus();
          return;
        }

        if (!senderEmailInput.value.trim()) {
          setMessage(editorMessage, "Sender email must not be empty.", true);
          senderEmailInput.focus();
          return;
        }

        if (!currentId && !appPasswordInput.value.trim()) {
          setMessage(editorMessage, "Google app password must not be empty.", true);
          appPasswordInput.focus();
          return;
        }

        const payload = {
          id: currentId,
          ownerName: ownerNameInput.value.trim(),
          senderEmail: senderEmailInput.value.trim(),
          appPassword: appPasswordInput.value.trim(),
        };

        await fetchJson("/api/credentials", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        setMessage(editorMessage, "Credential saved.");
        window.setTimeout(() => {
          window.location.href = "/credentials_ui.html";
        }, 600);
      } catch (error) {
        setMessage(editorMessage, error.message || "Unable to save credential.", true);
      }
    }

    async function deleteCredential(credential) {
      const accepted = window.confirm(`Delete "${credential.ownerName}"?\n\n${credential.senderEmail}`);
      if (!accepted) return;

      try {
        await fetchJson(`/api/credentials?id=${encodeURIComponent(credential.id)}`, {
          method: "DELETE",
        });
        await loadCredentials();
      } catch (error) {
        setMessage(managerMessage, error.message || "Unable to delete credential.", true);
      }
    }

    saveCredentialButton.addEventListener("click", saveCredential);

    const selectedId = queryValue("id");
    const isNew = new URLSearchParams(window.location.search).has("new");

    if (isNew) {
      currentId = "";
      showEditor(true);
    } else if (selectedId) {
      showEditor(false);
      loadCredential(selectedId).catch((error) => {
        setMessage(editorMessage, error.message || "Unable to load credential.", true);
      });
    } else {
      showManager();
      loadCredentials().catch((error) => {
        setMessage(managerMessage, error.message || "Unable to load credentials.", true);
      });
    }
  </script>
</body>
</html>
