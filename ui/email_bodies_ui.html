<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Bodies</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #111827;
      --bg-3: #1e293b;
      --surface: rgba(17, 24, 39, 0.78);
      --surface-2: rgba(15, 23, 42, 0.9);
      --line: rgba(148, 163, 184, 0.24);
      --line-strong: rgba(148, 163, 184, 0.38);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-2: #16a34a;
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.12);
      --shadow: 0 20px 60px rgba(2, 6, 23, 0.55);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 10%, #1d4ed833 0%, transparent 38%),
        radial-gradient(circle at 80% 20%, #16a34a22 0%, transparent 40%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2) 45%, var(--bg-3));
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      letter-spacing: 0.01em;
    }

    main {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0;
    }

    .shell {
      background: linear-gradient(160deg, var(--surface), var(--surface-2));
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      padding: 28px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 34px;
      line-height: 1.12;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: 0.01em;
    }

    h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
      color: #f8fafc;
    }

    .subtitle,
    .note,
    .message {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .content {
      display: grid;
      grid-template-columns: minmax(300px, 430px) minmax(0, 1fr);
      gap: 22px;
      padding: 26px 28px 28px;
    }

    .manager-content {
      grid-template-columns: 1fr;
    }

    .hidden {
      display: none;
    }

    .panel {
      display: grid;
      gap: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      background: rgba(148, 163, 184, 0.04);
      align-self: start;
    }

    .stack {
      display: grid;
      gap: 14px;
    }

    .body-list {
      display: grid;
      gap: 12px;
    }

    .body-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      background: rgba(15, 23, 42, 0.42);
    }

    .body-title {
      margin: 0 0 6px;
      font-weight: 800;
      color: #f8fafc;
    }

    .body-path {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      word-break: break-word;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    label {
      display: grid;
      gap: 8px;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      color: #e2e8f0;
      font: inherit;
      outline: none;
      background: rgba(15, 23, 42, 0.55);
      transition: border-color 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: #64748b;
    }

    textarea {
      min-height: 170px;
      resize: vertical;
      line-height: 1.5;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
      background: rgba(15, 23, 42, 0.75);
    }

    .actions,
    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button,
    .button-link {
      min-height: 42px;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .primary {
      border: 1px solid #22c55e99;
      background: linear-gradient(120deg, var(--accent-2), var(--accent));
      color: #f0fdf4;
      box-shadow: 0 8px 18px rgba(22, 163, 74, 0.25);
    }

    .secondary,
    .button-link {
      border: 1px solid var(--line);
      background: rgba(148, 163, 184, 0.08);
      color: #e5e7eb;
    }

    .danger-button {
      border: 1px solid #f87171aa;
      background: var(--danger-soft);
      color: #fecaca;
    }

    button:hover,
    .button-link:hover {
      transform: translateY(-1px);
    }

    .contribution {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
    }

    .contribution textarea {
      min-height: 78px;
    }

    .preview-frame {
      width: 100%;
      min-height: 640px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: #ffffff;
    }

    .message.error {
      color: #fecaca;
      font-weight: 700;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      max-width: min(380px, calc(100% - 40px));
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #22c55e66;
      background: linear-gradient(120deg, #14532d, #166534);
      color: #f0fdf4;
      box-shadow: 0 14px 35px rgba(15, 23, 42, 0.35);
      font-size: 13px;
      line-height: 1.45;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 920px) {
      main {
        width: min(100% - 18px, 1220px);
        padding: 14px 0;
      }

      header,
      .content {
        padding-left: 16px;
        padding-right: 16px;
      }

      header,
      .content,
      .body-item,
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="shell" aria-labelledby="page-title">
      <header>
        <div>
          <h1 id="page-title">Email Bodies</h1>
          <p class="subtitle" id="page-subtitle">Manage saved email templates for the sender.</p>
        </div>
        <a class="button-link" href="/">Back to Sender</a>
      </header>

      <div id="manager-view" class="content manager-content">
        <section class="panel" aria-label="Manage email bodies">
          <div class="actions">
            <a class="primary button-link" href="/email_bodies_ui.html?new=1">Create Email Body</a>
          </div>
          <div id="body-list" class="body-list" aria-live="polite"></div>
          <p id="manager-message" class="message">Loading email bodies...</p>
        </section>
      </div>

      <div id="editor-view" class="content hidden">
        <section class="panel" aria-label="Email body editor">
          <h2>Editor</h2>

          <label>
            Email body name
            <input id="body-name" type="text" placeholder="Playwright custom version" />
          </label>

          <label>
            Role
            <input id="role" type="text" value="SDET" />
          </label>

          <div class="grid">
            <label>
              Header name
              <input id="header-name" type="text" value="ABHISHEK KUMAR" />
            </label>
            <label>
              Skills line
              <input id="skills-line" type="text" value="Playwright | Selenium | Rest-Assured | 3+ Years Experience" />
            </label>
          </div>

          <div class="grid">
            <label>
              Phone
              <input id="phone" type="text" value="+91 7903907591" />
            </label>
            <label>
              LinkedIn URL
              <input id="linkedin" type="url" value="https://www.linkedin.com/in/abhikrs137" />
            </label>
          </div>

          <label>
            Opening message
            <textarea id="opening">I'm reaching out to explore opportunities for a {{role}} role in your organization.</textarea>
          </label>

          <label>
            Availability message
            <textarea id="availability">I am currently available to join immediately and actively looking for new opportunities.</textarea>
          </label>

          <div class="grid">
            <label>
              Closing text
              <input id="closing-text" type="text" value="Best regards," />
            </label>
            <label>
              Signature name
              <input id="signature-name" type="text" value="Abhishek Kumar" />
            </label>
          </div>

          <div class="stack">
            <label>Key contributions</label>
            <div id="contributions"></div>
            <button class="secondary" type="button" id="add-contribution">Add Contribution</button>
          </div>

          <div class="actions">
            <button class="primary" type="button" id="save-body">Save Email Body</button>
            <button class="secondary" type="button" id="preview-body">Preview</button>
            <a class="secondary button-link" href="/email_bodies_ui.html">Back to List</a>
          </div>

          <p id="message" class="message">Use {{name}} in the body where the recipient name should appear.</p>
        </section>

        <section class="stack" aria-label="HTML and preview">
          <section class="panel">
            <h2>Preview</h2>
            <iframe id="preview" class="preview-frame" title="Email body preview"></iframe>
          </section>
        </section>
      </div>
    </section>
  </main>
  <textarea id="html-content" hidden></textarea>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const pageTitle = document.querySelector("#page-title");
    const pageSubtitle = document.querySelector("#page-subtitle");
    const managerView = document.querySelector("#manager-view");
    const editorView = document.querySelector("#editor-view");
    const bodyList = document.querySelector("#body-list");
    const managerMessage = document.querySelector("#manager-message");
    const bodyNameInput = document.querySelector("#body-name");
    const roleInput = document.querySelector("#role");
    const headerNameInput = document.querySelector("#header-name");
    const skillsLineInput = document.querySelector("#skills-line");
    const phoneInput = document.querySelector("#phone");
    const linkedinInput = document.querySelector("#linkedin");
    const openingInput = document.querySelector("#opening");
    const availabilityInput = document.querySelector("#availability");
    const closingTextInput = document.querySelector("#closing-text");
    const signatureNameInput = document.querySelector("#signature-name");
    const contributions = document.querySelector("#contributions");
    const addContributionButton = document.querySelector("#add-contribution");
    const saveBodyButton = document.querySelector("#save-body");
    const previewBodyButton = document.querySelector("#preview-body");
    const htmlContent = document.querySelector("#html-content");
    const preview = document.querySelector("#preview");
    const message = document.querySelector("#message");
    const toast = document.querySelector("#toast");
    let currentPath = "";
    let toastTimer = null;

    const starterContributions = [
      "Architected a Playwright + TypeScript POM framework from scratch at Tech Mahindra, drove 35% critical workflow coverage in 3 months, cutting regression cycles from 3 weeks to 2.",
      "Built a full Selenium + Java suite with 400+ test cases at Nagarro, reduced regression time by 40% across sanity and e2e workflows.",
      "Hands-on with Jenkins CI/CD, Allure reporting, cross-browser execution, and Jira/Zephyr lifecycle management."
    ];

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove("show"), 3000);
    }

    function setMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle("error", isError);
    }

    function setManagerMessage(text, isError = false) {
      managerMessage.textContent = text;
      managerMessage.classList.toggle("error", isError);
    }

    function addContribution(value = "") {
      const row = document.createElement("div");
      row.className = "contribution";
      row.innerHTML = `
        <textarea placeholder="Write one key contribution.">${escapeHtml(value)}</textarea>
        <button class="danger-button" type="button">Remove</button>
      `;
      row.querySelector("button").addEventListener("click", () => {
        row.remove();
        htmlContent.value = generateHtmlFromForm();
        updatePreview();
      });
      row.querySelector("textarea").addEventListener("input", () => {
        htmlContent.value = generateHtmlFromForm();
        updatePreview();
      });
      contributions.appendChild(row);
    }

    function resetContributions(values) {
      contributions.innerHTML = "";
      values.forEach(addContribution);
    }

    function contributionValues() {
      return Array.from(contributions.querySelectorAll("textarea"))
        .map((item) => item.value.trim())
        .filter(Boolean);
    }

    function generateHtmlFromForm() {
      const role = roleInput.value.trim() || "SDET";
      const opening = openingInput.value.trim().replaceAll("{{role}}", role);
      const availability = availabilityInput.value.trim();
      const closingText = closingTextInput.value.trim() || "Best regards,";
      const signatureName = signatureNameInput.value.trim() || headerNameInput.value || "Abhishek Kumar";
      const items = contributionValues().map((item) => `<li>${escapeHtml(item)}</li>`).join("\n          ");
      const linkedInUrl = linkedinInput.value.trim() || "#";
      const phone = phoneInput.value.trim();

      return `<!DOCTYPE html>
<html>
<head>
  <title>Email Preview</title>
</head>
<body>

<div style="background:#eef2ff; padding:30px 10px; font-family: 'Segoe UI', Arial, sans-serif;">

  <div style="max-width:620px; margin:auto; background:#ffffff; border-radius:14px; overflow:hidden; border:1px solid #e0e7ff;">

    <div style="background:#000000; padding:25px; text-align:center; color:white;">
      <div style="font-size:20px; font-weight:700;">${escapeHtml(headerNameInput.value || "ABHISHEK KUMAR")}</div>
      <div style="font-size:14px; opacity:0.9;">${escapeHtml(skillsLineInput.value)}</div>
      <div style="margin-top:10px; font-size:12px; background:rgba(255,255,255,0.2); display:inline-block; padding:6px 12px; border-radius:20px;">
          Phone: ${escapeHtml(phone)}
      </div>
      <div style="margin-top:10px; font-size:12px; background:rgba(255,255,255,0.2); display:inline-block; padding:6px 12px; border-radius:20px;">
          <a href="${escapeHtml(linkedInUrl)}" target="_blank" rel="noopener noreferrer" style="color:white; text-decoration:none;">LinkedIn Profile</a>
      </div>
    </div>

    <div style="padding:25px; color:#374151;">
      <p style="margin-top:0;">Hi {{name}},</p>

      <p>${escapeHtml(opening)}</p>

      <div style="background:#f9fafb; border-radius:10px; padding:15px; margin:20px 0; border:1px solid #eee;">
        <div style="font-weight:600; margin-bottom:8px;">Key Contributions :</div>
        <ul style="margin:0; padding-left:18px; font-size:14px;">
          ${items}
        </ul>
      </div>

      <p><span style="color:#059669; font-weight:600;">${escapeHtml(availability)}</span></p>

      <div style="text-align:center; margin:25px 0;">
        <a href="${escapeHtml(linkedInUrl)}" target="_blank" rel="noopener noreferrer"
           style="background:#000000; color:white; padding:12px 22px; border-radius:8px; text-decoration:none; font-size:14px;">
           View LinkedIn Profile
        </a>
      </div>

      <div style="margin-top:15px; font-size:14px; color:#374151; text-align:left;">
        <p style="margin:5px 0;">${escapeHtml(closingText)}</p>
        <p style="margin:0; font-weight:600;">${escapeHtml(signatureName)}</p>
      </div>
    </div>

  </div>

</div>

</body>
</html>`;
    }

    function updatePreview() {
      const sampleName = "Hiring Manager";
      preview.srcdoc = htmlContent.value.replaceAll("{{name}}", escapeHtml(sampleName)).replaceAll("{{Name}}", escapeHtml(sampleName));
    }

    function showManager() {
      pageTitle.textContent = "Manage Email Bodies";
      pageSubtitle.textContent = "Create, edit, or delete saved email templates.";
      managerView.classList.remove("hidden");
      editorView.classList.add("hidden");
    }

    function showEditor(isNew) {
      pageTitle.textContent = isNew ? "Create Email Body" : "Edit Email Body";
      pageSubtitle.textContent = "Fill the email details and preview before saving.";
      managerView.classList.add("hidden");
      editorView.classList.remove("hidden");
    }

    function optionPath() {
      return new URLSearchParams(window.location.search).get("path") || "";
    }

    function isCreateMode() {
      return new URLSearchParams(window.location.search).has("new");
    }

    async function loadEmailBodies() {
      const response = await fetch("/api/email-bodies");
      const data = await response.json();
      const templates = Array.isArray(data.templates) ? data.templates : [];
      bodyList.innerHTML = "";

      if (!templates.length) {
        setManagerMessage("No email bodies found. Create your first email body.");
        return;
      }

      templates.forEach((template) => {
        const row = document.createElement("article");
        row.className = "body-item";
        row.innerHTML = `
          <div>
            <p class="body-title">${escapeHtml(template.label)}</p>
            <p class="body-path">${escapeHtml(template.path)}</p>
          </div>
          <div class="row-actions">
            <a class="secondary button-link" href="/email_bodies_ui.html?path=${encodeURIComponent(template.path)}">Edit</a>
            <button class="danger-button" type="button" data-delete="${escapeHtml(template.path)}">Delete</button>
          </div>
        `;
        row.querySelector("[data-delete]").addEventListener("click", () => deleteEmailBody(template));
        bodyList.appendChild(row);
      });

      setManagerMessage(`${templates.length} email body template${templates.length === 1 ? "" : "s"} found.`);
    }

    async function loadSelectedTemplate(path) {
      if (!path) return;
      const response = await fetch(`/api/email-bodies?path=${encodeURIComponent(path)}`);
      const data = await response.json();

      if (!data.ok) {
        setMessage(data.message || "Unable to load email body.", true);
        return;
      }

      currentPath = data.body.path;
      bodyNameInput.value = data.body.path.split("/").pop().replace(/^email_body_/, "").replace(/\.html$/i, "").replaceAll("_", " ");
      htmlContent.value = data.body.content || "";
      fillFormFromHtml(data.body.content || "");
      updatePreview();
      setMessage("Loaded selected email body.");
    }

    function fillFormFromHtml(rawHtml) {
      const doc = new DOMParser().parseFromString(rawHtml, "text/html");
      const divs = Array.from(doc.querySelectorAll("div"));
      const paragraphs = Array.from(doc.querySelectorAll("p"));
      const headerName = divs.find((item) => (item.getAttribute("style") || "").includes("font-size:20px"));
      const skillsLine = divs.find((item) => (item.getAttribute("style") || "").includes("font-size:14px") && (item.getAttribute("style") || "").includes("opacity"));
      const phone = divs.find((item) => item.textContent.trim().startsWith("Phone:"));
      const linkedIn = Array.from(doc.querySelectorAll("a")).find((item) => item.textContent.includes("LinkedIn"));
      const listItems = Array.from(doc.querySelectorAll("li")).map((item) => item.textContent.trim()).filter(Boolean);
      const greetingIndex = paragraphs.findIndex((item) => item.textContent.trim().startsWith("Hi "));
      const signatureParagraphs = paragraphs.slice(-2);
      const availability = doc.querySelector("span[style*='color:#059669']");

      if (headerName) headerNameInput.value = headerName.textContent.trim();
      if (skillsLine) skillsLineInput.value = skillsLine.textContent.trim();
      if (phone) phoneInput.value = phone.textContent.replace("Phone:", "").trim();
      if (linkedIn) linkedinInput.value = linkedIn.getAttribute("href") || "";
      if (greetingIndex >= 0 && paragraphs[greetingIndex + 1]) openingInput.value = paragraphs[greetingIndex + 1].textContent.trim();
      if (availability) availabilityInput.value = availability.textContent.trim();
      if (signatureParagraphs[0]) closingTextInput.value = signatureParagraphs[0].textContent.trim();
      if (signatureParagraphs[1]) signatureNameInput.value = signatureParagraphs[1].textContent.trim();
      if (listItems.length) resetContributions(listItems);
    }

    async function saveEmailBody() {
      if (!bodyNameInput.value.trim()) {
        setMessage("Email body name is required.", true);
        bodyNameInput.focus();
        return;
      }

      if (!htmlContent.value.trim()) {
        setMessage("Email body content is required.", true);
        return;
      }

      htmlContent.value = generateHtmlFromForm();

      const response = await fetch("/api/email-bodies", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: bodyNameInput.value.trim(),
          path: currentPath,
          content: htmlContent.value,
        }),
      });
      const data = await response.json();

      if (!data.ok) {
        setMessage(data.message || "Unable to save email body.", true);
        return;
      }

      currentPath = data.body.path;
      updatePreview();
      setMessage(`Saved ${data.body.path}.`);
      showToast("Email body saved.");
      window.setTimeout(() => {
        window.location.href = "/email_bodies_ui.html";
      }, 700);
    }

    function resetForNewBody() {
      currentPath = "";
      bodyNameInput.value = "";
      htmlContent.value = generateHtmlFromForm();
      updatePreview();
      setMessage("New email body ready. Give it a name and save.");
      bodyNameInput.focus();
    }

    async function deleteEmailBody(template) {
      const accepted = window.confirm(`Delete "${template.label}"?\n\n${template.path}`);
      if (!accepted) return;

      const response = await fetch(`/api/email-bodies?path=${encodeURIComponent(template.path)}`, {
        method: "DELETE",
      });
      const data = await response.json();

      if (!data.ok) {
        setManagerMessage(data.message || "Unable to delete email body.", true);
        return;
      }

      showToast("Email body deleted.");
      await loadEmailBodies();
    }

    starterContributions.forEach(addContribution);
    htmlContent.value = generateHtmlFromForm();
    updatePreview();

    [roleInput, headerNameInput, skillsLineInput, phoneInput, linkedinInput, openingInput, availabilityInput, closingTextInput, signatureNameInput].forEach((input) => {
      input.addEventListener("input", () => {
        htmlContent.value = generateHtmlFromForm();
        updatePreview();
      });
    });

    addContributionButton.addEventListener("click", () => {
      addContribution();
      htmlContent.value = generateHtmlFromForm();
      updatePreview();
    });
    previewBodyButton.addEventListener("click", updatePreview);
    saveBodyButton.addEventListener("click", saveEmailBody);

    const selectedPath = optionPath();

    if (isCreateMode()) {
      showEditor(true);
      resetForNewBody();
    } else if (selectedPath) {
      showEditor(false);
      loadSelectedTemplate(selectedPath).catch(() => {
        setMessage("Unable to load email body. Start the local server with: python scripts/email_sender_server.py", true);
      });
    } else {
      showManager();
      loadEmailBodies().catch(() => {
        setManagerMessage("Unable to load email bodies. Start the local server with: python scripts/email_sender_server.py", true);
      });
    }
  </script>
