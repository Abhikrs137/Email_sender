<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #111827;
      --bg-3: #1e293b;
      --surface: rgba(17, 24, 39, 0.86);
      --line: rgba(148, 163, 184, 0.24);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-2: #16a34a;
      --danger: #fecaca;
      --shadow: 0 20px 60px rgba(2, 6, 23, 0.55);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at 10% 10%, #1d4ed833 0%, transparent 38%),
        radial-gradient(circle at 80% 20%, #16a34a22 0%, transparent 40%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2) 45%, var(--bg-3));
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    .panel {
      width: min(420px, 100%);
      display: grid;
      gap: 18px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0 0 6px;
      color: #f8fafc;
      font-size: 30px;
      line-height: 1.15;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    form {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 8px;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      color: #e2e8f0;
      font: inherit;
      outline: none;
      background: rgba(15, 23, 42, 0.55);
    }

    input:focus {
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
    }

    button {
      min-height: 44px;
      border: 1px solid #22c55e99;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 800;
      font-size: 14px;
      background: linear-gradient(120deg, var(--accent-2), var(--accent));
      color: #f0fdf4;
    }

    .message.error {
      color: var(--danger);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="panel">
    <div>
      <h1>Login</h1>
      <p>Enter your username and password to use the email sender.</p>
    </div>
    <form id="login-form">
      <label>
        Username
        <input id="username" type="text" autocomplete="username" required />
      </label>
      <label>
        Password
        <input id="password" type="password" autocomplete="current-password" required />
      </label>
      <button type="submit">Login</button>
    </form>
    <p id="message" class="message"></p>
  </main>

  <script>
    const form = document.querySelector("#login-form");
    const message = document.querySelector("#message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      message.classList.remove("error");

      const username = document.querySelector("#username").value.trim();
      const password = document.querySelector("#password").value.trim();

      if (!username || !password) {
        message.textContent = "Username and password must not be empty.";
        message.classList.add("error");
        return;
      }

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.message || "Unable to login.");
        }

        window.location.href = "/";
      } catch (error) {
        message.textContent = error.message || "Unable to login.";
        message.classList.add("error");
      }
    });
  </script>
</body>
</html>
